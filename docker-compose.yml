services:
  web:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${PORT:-8002}:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-core.settings}"
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: "${POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  asgi:
    build:
      context: .
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    ports:
      - "${WS_PORT:-8006}:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-core.settings}"
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: "${POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis

  celery:
    build:
      context: .
    command: celery -A core worker -l info --concurrency=2 --queues=default
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-core.settings}"
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: "${POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis

  celery-notifications:
    build:
      context: .
    command: celery -A core worker -l info --concurrency=1 --queues=notifications
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-core.settings}"
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: "${POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis

  celery-printing:
    build:
      context: .
    command: celery -A core worker -l info --concurrency=1 --queues=printing
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-core.settings}"
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST: "${POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: unless-stopped