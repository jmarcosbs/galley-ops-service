[project]
name = "marinheiros-orders-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "import-error",
    "no-member"
]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
ignore = ["E203"]
